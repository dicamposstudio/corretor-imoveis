<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Configurações | Painel do corretor</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
  <aside class="admin-sidebar" id="admin-sidebar">
    <a class="brand admin-brand" href="painel.html"><span class="brand-mark">JS</span><span class="brand-copy"><strong>João Silva Imóveis</strong><small>Painel administrativo</small></span></a>
    <nav class="admin-menu"><a href="painel.html">▦ <span>Visão geral</span></a><a href="painel.html#imoveis">⌂ <span>Imóveis</span></a><a href="novo-imovel.html">＋ <span>Novo imóvel</span></a><a href="painel.html#leads">◎ <span>Leads</span></a><a class="active" href="configuracoes.html">⚙ <span>Configurações</span></a></nav>
    <div class="admin-sidebar-foot"><a href="index.html" target="_blank" rel="noopener">↗ Ver portal</a><button id="logout-button" type="button">Sair</button></div>
  </aside>
  <div class="admin-content">
    <header class="admin-topbar"><button class="admin-menu-toggle" id="admin-menu-toggle">☰</button><div><span class="micro-label">Conta</span><strong>Configurações do portal</strong></div><a class="btn btn-outline" href="painel.html">← Voltar</a></header>
    <main class="admin-main narrow-admin">
      <section class="dashboard-head"><div><span class="eyebrow">Identidade</span><h1>Dados do corretor</h1><p>Essas informações aparecem no portal público e nos canais de contato.</p></div></section>
      <form class="form-card admin-form-card" id="settings-form">
        <div class="form-grid">
          <label>Nome<input class="form-control" id="s-name" required></label>
          <label>Nome da marca<input class="form-control" id="s-brand" required></label>
          <label>Iniciais da marca<input class="form-control" id="s-initials" maxlength="4" placeholder="JS"></label>
          <label>CRECI<input class="form-control" id="s-creci" placeholder="CRECI 00000-F"></label>
          <label>WhatsApp<input class="form-control" id="s-whatsapp" inputmode="tel" required placeholder="5581999999999"></label>
          <label>E-mail público<input class="form-control" id="s-email" type="email"></label>
          <label>Cidade<input class="form-control" id="s-city"></label>
          <label>Região de atuação<input class="form-control" id="s-region" placeholder="Recife e Região Metropolitana"></label>
          <label class="wide">URL da foto/logo<input class="form-control" id="s-avatar" type="url" placeholder="https://..."></label>
          <label class="wide">Apresentação<textarea class="form-control" id="s-bio" placeholder="Especialidade, regiões e proposta de atendimento."></textarea></label>
        </div>
        <div class="form-actions"><a class="btn btn-outline" href="painel.html">Cancelar</a><button class="btn" type="submit">Salvar configurações</button></div>
        <div id="settings-message" class="form-message" hidden></div>
      </form>
      <section class="panel config-note"><span class="micro-label">Integração</span><h2 id="backend-status">Verificando...</h2><p id="backend-copy"></p></section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="data.js"></script><script src="backend.js"></script><script src="configuracoes.js"></script>
</body>
</html>
