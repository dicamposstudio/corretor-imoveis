<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novo imóvel | Painel do corretor</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-shell">
  <header class="dashboard-top"><div class="container dashboard-nav"><a class="brand" href="painel.html"><span class="brand-mark">JS</span><span class="brand-copy"><strong>Painel do corretor</strong><small style="color:rgba(255,255,255,.65)">Cadastro de imóvel</small></span></a><a class="btn btn-light" href="painel.html">← Voltar ao painel</a></div></header>
  <main class="container dashboard-main">
    <div class="dashboard-head"><div><span class="eyebrow">Estoque</span><h1>Cadastrar novo imóvel</h1><p>Este cadastro alimenta o catálogo localmente para demonstrar como a operação pode funcionar sem depender do desenvolvedor.</p></div></div>
    <form class="form-card" id="property-form" style="max-width:900px">
      <div class="form-grid">
        <label>Código<input class="form-control" id="p-id" required placeholder="JS-450"></label>
        <label>Status<select class="form-control" id="p-status"><option>Disponível</option><option>Reservado</option><option>Vendido</option><option>Alugado</option></select></label>
        <label class="wide">Título<input class="form-control" id="p-title" required placeholder="Apartamento 3 quartos em Boa Viagem"></label>
        <label>Finalidade<select class="form-control" id="p-purpose"><option>Venda</option><option>Aluguel</option></select></label>
        <label>Tipo<select class="form-control" id="p-type"><option>Apartamento</option><option>Casa</option><option>Flat</option><option>Sala comercial</option><option>Terreno</option></select></label>
        <label>Bairro<input class="form-control" id="p-neighborhood" required></label>
        <label>Cidade<input class="form-control" id="p-city" value="Recife" required></label>
        <label>Valor<input class="form-control" id="p-value" type="number" min="0" required></label>
        <label>Área (m²)<input class="form-control" id="p-area" type="number" min="1" required></label>
        <label>Quartos<input class="form-control" id="p-bedrooms" type="number" min="0" value="2"></label>
        <label>Suítes<input class="form-control" id="p-suites" type="number" min="0" value="1"></label>
        <label>Vagas<input class="form-control" id="p-parking" type="number" min="0" value="1"></label>
        <label>Condomínio<input class="form-control" id="p-condo" type="number" min="0"></label>
        <label class="wide">Imagem principal (URL)<input class="form-control" id="p-image" type="url" value="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=82" required></label>
        <label class="wide">Descrição<textarea class="form-control" id="p-description" required placeholder="Descreva localização, diferenciais e perfil do imóvel."></textarea></label>
        <label class="wide">Diferenciais, separados por vírgula<input class="form-control" id="p-tags" placeholder="Varanda, lazer, vista livre"></label>
        <button class="btn wide" type="submit">Salvar imóvel</button>
      </div>
      <div id="property-success" class="success-box" hidden></div>
    </form>
  </main>
  <script src="data.js"></script><script src="novo-imovel.js"></script>
</body>
</html>
